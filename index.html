};
const H={en:'Every device, <em>checked.</em>',ar:'كل جهاز، <em>مفحوص.</em>'};
const PCB={en:{laptop:'laptop',computer:'computer'},ar:{laptop:'لابتوب',computer:'جهاز كمبيوتر'}};
const $=id=>document.getElementById(id);
let D={categories:[],products:[]},L=new URLSearchParams(location.search).get('lang')==='ar'?'ar':'en',C=-1,Q='',N=PG;
const wa=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt=c=>D.products.filter(p=>c<0||p.cat===c).length;
function tabs(){
  $('tabs').innerHTML=['<button class="tab'+(C<0?' on':'')+'" data-c="-1">'+T[L].all+'<sup>'+cnt(-1)+'</sup></button>']
    .concat(D.categories.map((c,i)=>'<button class="tab'+(C===i?' on':'')+'" data-c="'+i+'">'+esc(c[L])+'<sup>'+cnt(i)+'</sup></button>')).join('');
}
function grid(){
  const q=Q.trim().toLowerCase();
  const r=D.products.filter(p=>(C<0||p.cat===C)&&(!q||(p.brand+' '+p.name).toLowerCase().includes(q)));
  $('grid').innerHTML=r.length?r.slice(0,N).map(p=>{
    const n=(p.brand?p.brand+' ':'')+p.name;
    return '<article class="c"><div class="im"><img src="'+p.img+'" alt="'+esc(n)+'" loading="lazy" width="400" height="400" onerror="this.remove()"></div>'+
    '<div class="br">'+esc(p.brand)+'</div><div class="nm">'+esc(p.name)+'</div>'+(p.price?'<div class="pr">AED '+p.price+'</div>':'')+
    '<a class="en" target="_blank" rel="noopener" href="'+wa(T[L].hello+n)+'">'+T[L].enq+(L==='ar'?' ←':' →')+'</a></article>';
  }).join(''):'<div class="empty">'+T[L].none+'</div>';
  const m=$('more');m.hidden=r.length<=N;m.textContent=T[L].more;
}
let ST={phones:[],laptops:[]};
const IC={p:'<svg viewBox="0 0 24 24" fill="none" stroke="#6b675e" stroke-width="1.1"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/></svg>',l:'<svg viewBox="0 0 24 24" fill="none" stroke="#6b675e" stroke-width="1.1"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>'};
function stock(){
  [['gp',ST.phones,'p'],['gc',ST.laptops,'l']].forEach(([id,list,ic])=>{
    $(id).innerHTML=list.map(p=>{const n=p.brand+' '+p.name;
      return '<article class="c"><div class="im">'+(p.img?'<img src="'+p.img+'" alt="'+esc(n)+'" loading="lazy" width="400" height="400">':IC[ic])+'</div>'+
      '<div class="br">'+esc(p.brand)+'</div><div class="nm">'+esc(p.name)+'</div>'+
      '<div class="pr">'+(p.price?'AED '+p.price:T[L].askP)+'</div>'+
      '<a class="en" target="_blank" rel="noopener" href="'+wa(T[L].hello+n)+'">'+T[L].enq+(L==='ar'?' ←':' →')+'</a></article>';}).join('');
  });
}
function lang(){
  const t=T[L];
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll('[data-h2]').forEach(e=>e.innerHTML=t[e.dataset.h2]);
  document.querySelector('[data-h]').innerHTML=H[L];
  document.querySelectorAll('[data-wa]').forEach(e=>{const b=e.dataset.b;e.href=wa(t[e.dataset.wa].replace('{b}',PCB[L][b]||b))});
  $('rep').innerHTML=t.rep.map(s=>'<li><span>'+s[0]+'</span><small>'+s[1]+'</small><a href="'+wa(t.askRep.replace('{b}',s[0]))+'" target="_blank" rel="noopener" style="color:var(--gold);font-size:14px">'+t.fix+'</a></li>').join('');
  $('q').placeholder=t.search;$('lang').textContent=L==='ar'?'English':'عربي';
  ['msg','heroWa','ctaWa','repWa'].forEach(i=>$(i).href=wa(t.hi));
  tabs();grid();stock();
}
$('lang').onclick=()=>{L=L==='ar'?'en':'ar';lang()};
$('q').oninput=e=>{Q=e.target.value;N=PG;grid()};
$('tabs').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;C=+b.dataset.c;N=PG;tabs();grid()};
$('more').onclick=()=>{N+=PG;grid()};
$('yr').textContent=new Date().getFullYear();
fetch('stock.json').then(r=>r.json()).then(d=>{ST=d;stock()}).catch(()=>{});
fetch('catalog.json').then(r=>r.json()).then(d=>{D=d;lang()}).catch(()=>{$('grid').innerHTML='<div class="empty">Could not load products. Please refresh.</div>'});
lang();
</script>
