<style>
:root{--bg:#F5F2EC;--ink:#1A1A1A;--mut:#6F6B63;--line:#DDD8CE;--tile:#ECE8E0;--gold:#B8862B;--gt:#8A6414;--dk:#171717}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.w{max-width:1180px;margin:0 auto;padding:0 24px}
.serif,h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-weight:400}
header{position:sticky;top:0;z-index:20;background:var(--dk);color:#F4F2EC}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;line-height:1.1}
.logo img{height:28px;width:auto}
.logo b{display:block;letter-spacing:3px;font-size:14px;font-weight:600}
.logo small{display:block;color:#D4A64A;letter-spacing:3px;font-size:10px}
nav{display:flex;gap:30px;font-size:14px;color:#B9B5AC}
nav a:hover,.lang:hover{color:#fff}
.r{display:flex;align-items:center;gap:22px;font-size:14px}
.lang{background:none;border:0;color:#B9B5AC;font:inherit;cursor:pointer}
.btn{display:inline-block;padding:12px 26px;border:1px solid var(--ink);font-size:14px;letter-spacing:.3px;border-radius:2px;transition:.2s}
.btn.k{background:var(--ink);color:var(--bg)}
.btn.k:hover{background:var(--gt);border-color:var(--gt)}
.btn:not(.k):hover{background:var(--ink);color:var(--bg)}
header .btn{padding:8px 18px;border-color:#D4A64A;color:#D4A64A}
header .btn:hover{background:#D4A64A;color:var(--dk)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding-block:72px 64px}
.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gt);margin-bottom:22px}
h1{font-size:clamp(44px,6.4vw,84px);line-height:1.02;letter-spacing:-1.5px}
h1 em{font-style:italic;color:var(--gt)}
.hero p{color:var(--mut);max-width:46ch;margin:24px 0 32px;font-size:18px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mos div{background:var(--tile);aspect-ratio:1;display:grid;place-items:center}
.mos div:nth-child(2){transform:translateY(24px)}
.mos div:nth-child(4){transform:translateY(24px)}
.mos img{width:82%;height:82%;object-fit:contain;mix-blend-mode:multiply}
.strip{border-block:1px solid var(--line);font-size:13px;letter-spacing:2px;color:var(--mut)}
.strip .w{display:flex;justify-content:space-between;gap:16px;padding-block:16px;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:72px 0 24px;flex-wrap:wrap}
h2{font-size:clamp(30px,4.4vw,50px);line-height:1.1;letter-spacing:-.8px}
h2 em{font-style:italic;color:var(--gt)}
.q{border:0;border-bottom:1px solid var(--ink);background:none;padding:10px 2px;font:inherit;min-width:260px;outline:none;color:var(--ink)}
.q::placeholder{color:var(--mut)}
.tabs{position:sticky;top:64px;z-index:10;background:var(--bg);display:flex;gap:26px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:14px 0;margin-bottom:-1px;font:inherit;font-size:14px;color:var(--mut);cursor:pointer;white-space:nowrap}
.tab sup{font-size:10px;margin-inline-start:3px}
.tab.on{color:var(--ink);border-color:var(--gold)}
.note{color:var(--mut);font-size:14px;margin:22px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:36px 22px}
.c{display:flex;flex-direction:column}
.im{background:var(--tile);aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.im img{width:84%;height:84%;object-fit:contain;mix-blend-mode:multiply;transition:transform .5s}
.c:hover .im img{transform:scale(1.05)}
.br{font-size:11px;letter-spacing:2px;color:var(--gt);text-transform:uppercase;margin-top:14px;min-height:16px}
.nm{font-size:15px;line-height:1.35;margin:3px 0 8px}
.pr{font-size:14px;font-weight:600}
.en{margin-top:auto;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);align-self:flex-start;padding-bottom:1px}
.en:hover{color:var(--ink);border-color:var(--ink)}
.more{display:block;margin:52px auto 0}
.empty{grid-column:1/-1;color:var(--mut);padding:50px 0}
section.s{padding:88px 0 0}
.cols{display:grid;grid-template-columns:repeat(4,1fr);margin-top:34px;border-top:1px solid var(--ink)}
.col{padding:22px 24px 8px 0}
.col+.col{border-inline-start:1px solid var(--line);padding-inline-start:24px}
.col h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:21px;margin-bottom:6px}
.col p{color:var(--mut);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:34px}
.list li{list-style:none;padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.list li:first-child{border-top:1px solid var(--ink)}
.list span:first-child{color:var(--mut);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.big{font-family:Georgia,serif;font-size:clamp(26px,3.6vw,40px);line-height:1.2;margin-bottom:24px}
footer{background:var(--dk);color:#B9B5AC;margin-top:96px;padding:34px 0 40px;font-size:14px}
footer .w{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.fl{display:flex;align-items:center;gap:12px;color:#F4F2EC}
.fl img{height:24px}
.fl b{letter-spacing:3px;font-size:13px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:40px;padding-block:44px 48px}.grid{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr 1fr}.col:nth-child(3){border-inline-start:0;padding-inline-start:0}.two{grid-template-columns:1fr;gap:36px}nav{display:none}}
@media(max-width:560px){.w{padding:0 18px}.grid{grid-template-columns:repeat(2,1fr);gap:28px 14px}.cols{grid-template-columns:1fr}.col,.col+.col{border:0;border-top:1px solid var(--line);padding:18px 0}.col:first-child{border-top:0}.q{min-width:0;width:100%}.r{gap:14px}header .btn{padding:7px 12px}.head{padding-top:52px}section.s{padding-top:64px}}
</style>
</head>
<body>

  </div>
  <div style="padding-top:8px">
    <div class="big" data-t="addr"></div>
    <ul class="list">
      <li><span data-t="whatsH"></span><a dir="ltr" href="https://wa.me/971555400551" target="_blank" rel="noopener">+971 55 540 0551</a></li>
      <li><span data-t="mailH"></span><a dir="ltr" href="mailto:zaitoonmobile@gmail.com">zaitoonmobile@gmail.com</a></li>

</div></footer>

<script>
const WA='971555400551',PG=24;
const T={
en:{brand:'Al Zaitoon Computer & Mobile Phones',city:'Ras Al Khaimah',navShop:'Collection',navWhy:'Our Promise',navVisit:'Visit',msg:'Message us',browse:'Browse the collection',eyebrow:'MOBILES · LAPTOPS · IPADS · RAS AL KHAIMAH',sub:'Technology should feel effortless. We help you find the right phone, laptop or iPad, keep it running right, and bring it to your door.',s1:'AUTHENTIC PRODUCTS',s2:'DELIVERY ACROSS RAK',s3:'IN-HOUSE REPAIR',shopH:'The <em>collection</em>',search:'Search products or brands',all:'All',note:'Message us on WhatsApp for today’s best price.',none:'No products match your search.',enq:'Enquire on WhatsApp',more:'Show more',whyH:'Our <em>promise</em>',w1h:'Authentic products only',w1p:'Every device and accessory is genuine and checked.',w2h:'Best price',w2p:'Message us on WhatsApp for today’s best price.',w3h:'Delivery across RAK',w3p:'We bring your order to your door.',w4h:'Repair service',w4p:'Repairs for your phone, laptop and iPad.',srv:[['Sales','Computers & laptops'],['Repair','Repair & maintenance'],['Mobiles','Mobile sales & repair'],['Service','Screen & battery replacement'],['Shop','Accessories']],visitH:'Visit <em>us</em>',addr:'Al Dhait South, Ras Al Khaimah, UAE',whatsH:'WhatsApp',mailH:'Email',chH:'WhatsApp channel',chL:'Follow our channel',dir:'Get directions',hello:'Hello Al Zaitoon, I’d like to ask about: ',hi:'Hello Al Zaitoon, I’d like to ask about your products.'},
ar:{brand:'الزيتون للكمبيوتر والهواتف المحمولة',city:'رأس الخيمة',navShop:'المنتجات',navWhy:'وعدنا',navVisit:'زورونا',msg:'راسلنا',browse:'تصفح المنتجات',eyebrow:'جوالات · لابتوبات · آيباد · رأس الخيمة',sub:'التقنية يجب أن تكون سهلة. نساعدك في اختيار الهاتف أو اللابتوب أو الآيباد المناسب، ونحافظ على عمله، ونوصله إلى باب بيتك.',s1:'منتجات أصلية',s2:'توصيل في رأس الخيمة',s3:'صيانة داخل المحل',shopH:'<em>المنتجات</em>',search:'ابحث عن منتج أو ماركة',all:'الكل',note:'راسلنا على واتساب لأفضل سعر اليوم.',none:'لا توجد منتجات مطابقة لبحثك.',enq:'استفسر عبر واتساب',more:'عرض المزيد',whyH:'<em>وعدنا</em> لك',w1h:'منتجات أصلية فقط',w1p:'كل جهاز وملحق أصلي ومفحوص.',w2h:'أفضل سعر',w2p:'راسلنا على واتساب لأفضل سعر اليوم.',w3h:'توصيل في رأس الخيمة',w3p:'نوصل طلبك إلى باب بيتك.',w4h:'خدمة الصيانة',w4p:'صيانة الهاتف واللابتوب والآيباد.',srv:[['بيع','بيع أجهزة الكمبيوتر المحمولة والمكتبية'],['صيانة','الصيانة والإصلاح'],['جوالات','بيع الهواتف المحمولة وإصلاحها'],['خدمة','استبدال الشاشة والبطارية'],['متجر','ملحقات']],visitH:'<em>زورونا</em>',addr:'الظيت الجنوبي، رأس الخيمة، الإمارات',whatsH:'واتساب',mailH:'البريد الإلكتروني',chH:'قناة واتساب',chL:'تابع قناتنا',dir:'الاتجاهات',hello:'مرحباً الزيتون، أود الاستفسار عن: ',hi:'مرحباً الزيتون، أود الاستفسار عن منتجاتكم.'}
};
const H={en:'Every device, <em>checked.</em>',ar:'كل جهاز، <em>مفحوص.</em>'};
const FEAT=['apple-airpods-pro-3','samsung-galaxy-watch-ultra','apple-airpods-max-2','samsung-galaxy-buds4-pro'];
const $=id=>document.getElementById(id);
let D={categories:[],products:[]},L=new URLSearchParams(location.search).get('lang')==='ar'?'ar':'en',C=-1,Q='',N=PG;
const wa=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt=c=>D.products.filter(p=>c<0||p.cat===c).length;
function tabs(){
  $('tabs').innerHTML=['<button class="tab'+(C<0?' on':'')+'" data-c="-1">'+T[L].all+'<sup>'+cnt(-1)+'</sup></button>']
    .concat(D.categories.map((c,i)=>'<button class="tab'+(C===i?' on':'')+'" data-c="'+i+'">'+esc(c[L])+'<sup>'+cnt(i)+'</sup></button>')).join('');
}
function grid(){
  const q=Q.trim().toLowerCase();
  const r=D.products.filter(p=>(C<0||p.cat===C)&&(!q||(p.brand+' '+p.name).toLowerCase().includes(q)));
  $('grid').innerHTML=r.length?r.slice(0,N).map(p=>{
    const n=(p.brand?p.brand+' ':'')+p.name;
    return '<article class="c"><div class="im"><img src="'+p.img+'" alt="'+esc(n)+'" loading="lazy" width="400" height="400" onerror="this.remove()"></div>'+
    '<div class="br">'+esc(p.brand)+'</div><div class="nm">'+esc(p.name)+'</div>'+(p.price?'<div class="pr">AED '+p.price+'</div>':'')+
    '<a class="en" target="_blank" rel="noopener" href="'+wa(T[L].hello+n)+'">'+T[L].enq+' →</a></article>';
  }).join(''):'<div class="empty">'+T[L].none+'</div>';
  const m=$('more');m.hidden=r.length<=N;m.textContent=T[L].more;
}
function mos(){
  $('mos').innerHTML=FEAT.map(id=>D.products.find(p=>p.id===id)).filter(Boolean).map(p=>'<div><img src="'+p.img+'" alt="'+esc(p.name)+'"></div>').join('');
}
function lang(){
  const t=T[L];
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll('[data-h2]').forEach(e=>e.innerHTML=t[e.dataset.h2]);
  document.querySelector('[data-h]').innerHTML=H[L];
  $('srv').innerHTML=t.srv.map(s=>'<li><span>'+s[0]+'</span><span>'+s[1]+'</span></li>').join('');
  $('q').placeholder=t.search;$('lang').textContent=L==='ar'?'English':'عربي';
  ['msg','heroWa','ctaWa'].forEach(i=>$(i).href=wa(t.hi));
  tabs();grid();
}
$('lang').onclick=()=>{L=L==='ar'?'en':'ar';lang()};
$('q').oninput=e=>{Q=e.target.value;N=PG;grid()};
$('tabs').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;C=+b.dataset.c;N=PG;tabs();grid()};
$('more').onclick=()=>{N+=PG;grid()};
$('yr').textContent=new Date().getFullYear();
fetch('catalog.json').then(r=>r.json()).then(d=>{D=d;mos();lang()}).catch(()=>{$('grid').innerHTML='<div class="empty">Could not load products. Please refresh.</div>'});
lang();
</script>
