<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Zaitoon Computer &amp; Mobile Phones · Mobiles, Laptops, iPads &amp; Repair · Ras Al Khaimah</title>
<meta name="description" content="Al Zaitoon Computer &amp; Mobile Phones in Al Dhait South, Ras Al Khaimah: mobiles, laptops, iPads, accessories and repair. Delivery available across RAK. WhatsApp +971 55 540 0551.">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:type" content="website">
<meta property="og:title" content="Al Zaitoon Computer &amp; Mobile Phones · Every device, checked.">
<meta property="og:description" content="Mobiles, laptops, iPads, accessories &amp; repair in Ras Al Khaimah. Delivery available.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0A'/%3E%3Cpath d='M18 20h28L18 44h28' fill='none' stroke='%23B7D36B' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0A0A0A;--card:#151515;--line:#262626;--tx:#F4F2EC;--mut:#9A978F;--ac:#B7D36B;--wa:#25D366}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.w{max-width:1200px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ac);color:#0A0A0A;font-style:normal;font-weight:800}
nav{display:flex;align-items:center;gap:20px;font-size:14px;color:var(--mut)}
nav a:hover{color:var(--tx)}
.lang{border:1px solid var(--line);background:none;color:var(--tx);padding:6px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.hero{padding:72px 0 48px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.05;letter-spacing:-1.5px;max-width:14ch}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p{color:var(--mut);max-width:52ch;margin:18px 0 28px;font-size:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;font-weight:600;border:1px solid var(--line)}
.btn.p{background:var(--ac);color:#0A0A0A;border-color:var(--ac)}
.btn.wa{background:var(--wa);color:#04210F;border-color:var(--wa)}
.tools{position:sticky;top:64px;z-index:10;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
.q{width:100%;padding:13px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:none}
.q:focus{border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tx);color:#0A0A0A;border-color:var(--tx)}
.cnt{color:var(--mut);font-size:14px;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:64px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.c:hover{border-color:#3a3a3a;transform:translateY(-2px)}
.im{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative}
.im img{width:100%;height:100%;object-fit:contain}
.im b{position:absolute;font-size:44px;color:#bbb}
.in{padding:14px 14px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.br{font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:1px;min-height:18px}
.nm{font-size:15px;font-weight:600;line-height:1.3}
.pr{color:var(--mut);font-size:13px;margin:4px 0 10px}
.ord{margin-top:auto;text-align:center;padding:10px;border-radius:12px;background:var(--wa);color:#04210F;font-weight:600;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
section.s{padding:56px 0;border-top:1px solid var(--line)}
section.s h2{font-size:clamp(26px,4vw,38px);letter-spacing:-.8px;margin-bottom:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.box h3{margin-bottom:6px}
.box p{color:var(--mut)}
footer{border-top:1px solid var(--line);padding:26px 0 90px;color:var(--mut);font-size:14px}
.fab{position:fixed;inset-inline-end:18px;bottom:18px;z-index:30;width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab svg{width:30px;height:30px;fill:#fff}
@media(max-width:640px){nav a{display:none}.hero{padding:44px 0 30px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.in{padding:11px}}
</style>
</head>
<body>
<header><div class="w bar">
  <a class="logo" href="#top"><i>Z</i><span data-t="brand"></span></a>
  <nav><a href="#collection" data-t="navShop"></a><a href="#promise" data-t="navWhy"></a><a href="#visit" data-t="navVisit"></a><button class="lang" id="lang">العربية</button></nav>
</div></header>

<main id="top">
<div class="w hero">
  <h1 data-h="hero"></h1>
  <p data-t="sub"></p>
  <a class="btn wa" id="heroWa" target="_blank" rel="noopener" data-t="chat"></a>
</div>

<div class="tools" id="collection"><div class="w">
  <input class="q" id="q" type="search" autocomplete="off">
  <div class="chips" id="chips"></div>
</div></div>

<div class="w">
  <div class="cnt" id="cnt"></div>
  <div class="grid" id="grid"></div>
</div>

<section class="s" id="promise"><div class="w">
  <h2 data-t="whyH"></h2>
  <div class="cols">
    <div class="box"><h3 data-t="w1h"></h3><p data-t="w1p"></p></div>
    <div class="box"><h3 data-t="w2h"></h3><p data-t="w2p"></p></div>
    <div class="box"><h3 data-t="w3h"></h3><p data-t="w3p"></p></div>
  </div>
</div></section>

<section class="s" id="visit"><div class="w">
  <h2 data-t="visitH"></h2>
  <div class="cols">
    <div class="box"><h3 data-t="addrH"></h3><p data-t="addr"></p></div>
    <div class="box"><h3 data-t="whatsH"></h3><p dir="ltr" style="text-align:start"><a href="https://wa.me/971555400551" target="_blank" rel="noopener">+971 55 540 0551</a></p></div>
  </div>
</div></section>
</main>

<footer><div class="w">© <span id="yr"></span> <span data-t="brand"></span> · <a href="#top" data-t="top"></a></div></footer>

<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 32 32"><path d="M4 5h24v16H14l-7 6v-6H4z"/></svg></a>

<script>
const WA='971555400551';
const T={
en:{brand:'Al Zaitoon Computer & Mobile Phones',navShop:'Shop',navWhy:'Why us',navVisit:'Visit',sub:'Mobiles, laptops, iPads, accessories and repair in Ras Al Khaimah. Delivery available across RAK.',chat:'Chat on WhatsApp',search:'Search products or brands…',all:'All',items:n=>n+(n===1?' product':' products'),none:'No products match your search.',ask:'Ask for price',order:'Order on WhatsApp',whyH:'Why Al Zaitoon',w1h:'Every device, checked',w1p:'Each device is tested before it reaches you.',w2h:'Delivery across RAK',w2p:'Order on WhatsApp and we deliver to your door.',w3h:'Repair in-house',w3p:'Phones, tablets and laptops repaired by our team.',visitH:'Visit us',addrH:'Address',addr:'Al Dhait South, Ras Al Khaimah, UAE',whatsH:'WhatsApp',top:'Back to top',hello:'Hello Al Zaitoon, I’d like to order: ',hi:'Hello Al Zaitoon, I’d like to ask about your products.'},
ar:{brand:'الزيتون للكمبيوتر والجوالات',navShop:'المنتجات',navWhy:'لماذا نحن',navVisit:'زورونا',sub:'جوالات ولابتوبات وآيباد وإكسسوارات وصيانة في رأس الخيمة. التوصيل متاح في جميع أنحاء الإمارة.',chat:'تواصل عبر واتساب',search:'ابحث عن منتج أو ماركة…',all:'الكل',items:n=>n+' منتج',none:'لا توجد منتجات مطابقة لبحثك.',ask:'اسأل عن السعر',order:'اطلب عبر واتساب',whyH:'لماذا الزيتون',w1h:'كل جهاز مفحوص',w1p:'نفحص كل جهاز قبل أن يصل إليك.',w2h:'توصيل في رأس الخيمة',w2p:'اطلب عبر واتساب ونوصل إلى باب بيتك.',w3h:'صيانة داخل المحل',w3p:'صيانة الجوالات والأجهزة اللوحية واللابتوبات على يد فريقنا.',visitH:'زورونا',addrH:'العنوان',addr:'الظيت الجنوبي، رأس الخيمة، الإمارات',whatsH:'واتساب',top:'إلى الأعلى',hello:'مرحباً الزيتون، أرغب بطلب: ',hi:'مرحباً الزيتون، أود الاستفسار عن منتجاتكم.'}
};
const H={en:'Every device, <em>checked.</em>',ar:'كل جهاز، <em>مفحوص.</em>'};
const $=id=>document.getElementById(id);
let D={categories:[],products:[]},L=new URLSearchParams(location.search).get('lang')==='ar'?'ar':'en',C=-1,Q='';
const wa=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(){
  $('chips').innerHTML=['<button class="chip'+(C<0?' on':'')+'" data-c="-1">'+T[L].all+'</button>']
    .concat(D.categories.map((c,i)=>'<button class="chip'+(C===i?' on':'')+'" data-c="'+i+'">'+esc(c[L])+'</button>')).join('');
}
function grid(){
  const q=Q.trim().toLowerCase();
  const r=D.products.filter(p=>(C<0||p.cat===C)&&(!q||(p.brand+' '+p.name).toLowerCase().includes(q)));
  $('cnt').textContent=T[L].items(r.length);
  $('grid').innerHTML=r.length?r.map(p=>{
    const n=(p.brand?p.brand+' ':'')+p.name;
    return '<article class="c"><div class="im"><b>'+esc((p.brand||p.name).charAt(0))+'</b><img src="'+p.img+'" alt="'+esc(n)+'" loading="lazy" width="400" height="400" onerror="this.remove()"></div>'+
    '<div class="in"><div class="br">'+esc(p.brand)+'</div><div class="nm">'+esc(p.name)+'</div>'+
    '<div class="pr">'+(p.price?'AED '+p.price:T[L].ask)+'</div>'+
    '<a class="ord" target="_blank" rel="noopener" href="'+wa(T[L].hello+n)+'">'+T[L].order+'</a></div></article>';
  }).join(''):'<div class="empty">'+T[L].none+'</div>';
}
function lang(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[L][e.dataset.t]);
  document.querySelector('[data-h]').innerHTML=H[L];
  $('q').placeholder=T[L].search;$('lang').textContent=L==='ar'?'English':'العربية';
  $('heroWa').href=wa(T[L].hi);$('fab').href=wa(T[L].hi);
  chips();grid();
}
$('lang').onclick=()=>{L=L==='ar'?'en':'ar';lang()};
$('q').oninput=e=>{Q=e.target.value;grid()};
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;C=+b.dataset.c;chips();grid()};
$('yr').textContent=new Date().getFullYear();
fetch('catalog.json').then(r=>r.json()).then(d=>{D=d;lang()}).catch(()=>{$('grid').innerHTML='<div class="empty">Could not load products. Please refresh.</div>'});
lang();
</script>
</body>
</html>
