<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Zaitoon Computer &amp; Mobile Phones · Mobiles, Laptops, iPads &amp; Repair · Ras Al Khaimah</title>
<meta name="description" content="Al Zaitoon Computer &amp; Mobile Phones in Al Dhait South, Ras Al Khaimah: mobiles, laptops, iPads, accessories and repair. Delivery available across RAK. WhatsApp +971 55 540 0551.">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:type" content="website">
<meta property="og:title" content="Al Zaitoon Computer &amp; Mobile Phones · Every device, checked.">
<meta property="og:description" content="Mobiles, laptops, iPads, accessories &amp; repair in Ras Al Khaimah. Delivery available.">
<meta property="og:image" content="/logo.png">
<link rel="icon" href="/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
:root{--bg:#0B0B0B;--card:#141414;--line:#262626;--tx:#F4F2EC;--mut:#9A978F;--ac:#C9962F;--wa:#25D366}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Roboto,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.w{max-width:1200px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,11,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{display:flex;align-items:center;gap:12px;line-height:1.1}
.logo img{height:30px;width:auto}
.logo b{display:block;letter-spacing:2px;font-size:15px}
.logo small{display:block;color:var(--ac);letter-spacing:2.5px;font-size:11px;font-weight:500}
nav{display:flex;align-items:center;gap:26px;font-size:14px;color:var(--mut)}
nav a:hover{color:var(--tx)}
.r{display:flex;align-items:center;gap:10px}
.lang{border:1px solid var(--line);background:none;color:var(--tx);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:99px;font-weight:600;border:1px solid var(--line);font-size:15px}
.btn.g{background:var(--ac);color:#111;border-color:var(--ac)}
.hero{text-align:center;padding:72px 0 56px;background:radial-gradient(60% 70% at 50% 30%,rgba(201,150,47,.14),transparent 70%)}
.hero img{height:110px;width:auto;margin-bottom:28px}
.eyebrow{color:var(--ac);letter-spacing:4px;font-size:13px;font-weight:500;margin-bottom:18px}
.hero h1{font-size:clamp(40px,8vw,86px);line-height:1.02;letter-spacing:-2px;font-weight:500}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p{color:var(--mut);max-width:60ch;margin:22px auto 30px;font-size:18px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tools{position:sticky;top:68px;z-index:10;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
.q{width:100%;padding:13px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:none}
.q:focus{border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac)}
.cnt{color:var(--mut);font-size:14px;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:64px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.c:hover{border-color:var(--ac);transform:translateY(-2px)}
.im{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative}
.im img{width:100%;height:100%;object-fit:contain}
.im b{position:absolute;font-size:44px;color:#bbb}
.in{padding:14px 14px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.br{font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:1px;min-height:18px}
.nm{font-size:15px;font-weight:500;line-height:1.3}
.pr{color:var(--mut);font-size:13px;margin:4px 0 10px}
.ord{margin-top:auto;text-align:center;padding:10px;border-radius:12px;background:var(--ac);color:#111;font-weight:600;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
section.s{padding:60px 0;border-top:1px solid var(--line)}
section.s h2{font-size:clamp(28px,4.5vw,44px);letter-spacing:-1px;font-weight:500;margin-bottom:26px}
section.s h2 em{font-style:normal;color:var(--ac)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--ac);border-radius:16px;padding:22px}
.box h3{font-weight:500;margin-bottom:6px;font-size:18px}
.box p{color:var(--mut)}
.srv{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.srv span{border:1px solid var(--line);border-radius:99px;padding:8px 16px;color:var(--mut);font-size:14px}
.ig{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin-top:22px}
.ig small{color:var(--mut);letter-spacing:2px;font-size:12px}
.cta{text-align:center;background:radial-gradient(50% 80% at 50% 100%,rgba(201,150,47,.16),transparent 70%)}
footer{border-top:1px solid var(--line);padding:28px 0 96px;color:var(--mut);font-size:14px}
footer .w{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.fl{display:flex;align-items:center;gap:12px}
.fl img{height:26px}
.fl small{display:block;color:var(--ac);letter-spacing:2px;font-size:11px}
.fab{position:fixed;inset-inline-end:18px;bottom:18px;z-index:30;width:56px;height:56px;border-radius:50%;background:var(--ac);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab svg{width:28px;height:28px;fill:#111}
@media(max-width:760px){nav{display:none}.hero{padding:44px 0 36px}.hero img{height:84px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.in{padding:11px}.btn{padding:10px 16px}}
</style>
</head>
<body>
<header><div class="w bar">
  <a class="logo" href="#top"><img src="/logo.png" alt=""><span><b>ZAITOON</b><small>MOBILES</small></span></a>
  <nav><a href="#collection" data-t="navShop"></a><a href="#promise" data-t="navWhy"></a><a href="#visit" data-t="navVisit"></a></nav>
  <div class="r"><button class="lang" id="lang">عربي</button><a class="btn g" id="msg" target="_blank" rel="noopener" data-t="msg"></a></div>
</div></header>

<main id="top">
<div class="hero"><div class="w">
  <img src="/logo.png" alt="Al Zaitoon">
  <div class="eyebrow" data-t="eyebrow"></div>
  <h1 data-h></h1>
  <p data-t="sub"></p>
  <div class="row"><a class="btn g" id="heroWa" target="_blank" rel="noopener" data-t="msg"></a><a class="btn" href="#collection" data-t="browse"></a></div>
</div></div>

<div class="tools" id="collection"><div class="w">
  <input class="q" id="q" type="search" autocomplete="off">
  <div class="chips" id="chips"></div>
</div></div>
<div class="w"><div class="cnt" id="cnt"></div><div class="grid" id="grid"></div></div>

<section class="s" id="promise"><div class="w">
  <h2 data-h2="whyH"></h2>
  <div class="cols">
    <div class="box"><h3 data-t="w1h"></h3><p data-t="w1p"></p></div>
    <div class="box"><h3 data-t="w2h"></h3><p data-t="w2p"></p></div>
    <div class="box"><h3 data-t="w3h"></h3><p data-t="w3p"></p></div>
    <div class="box"><h3 data-t="w4h"></h3><p data-t="w4p"></p></div>
  </div>
  <div class="srv" id="srv"></div>
  <a class="ig" href="https://instagram.com/zaitoon.mobiles" target="_blank" rel="noopener"><small>INSTAGRAM</small><span dir="ltr">@zaitoon.mobiles ›</span></a>
</div></section>

<section class="s" id="visit"><div class="w">
  <h2 data-h2="visitH"></h2>
  <div class="cols">
    <div class="box"><h3 data-t="addrH"></h3><p data-t="addr"></p></div>
    <div class="box"><h3 data-t="whatsH"></h3><p dir="ltr" style="text-align:start"><a href="https://wa.me/971555400551" target="_blank" rel="noopener">+971 55 540 0551</a></p></div>
    <div class="box"><h3 data-t="mailH"></h3><p dir="ltr" style="text-align:start"><a href="mailto:zaitoonmobile@gmail.com">zaitoonmobile@gmail.com</a></p></div>
  </div>
</div></section>

<section class="s cta"><div class="w">
  <h2 data-h2="ctaH"></h2>
  <div class="row"><a class="btn g" id="ctaWa" target="_blank" rel="noopener" data-t="msg"></a><a class="btn" href="https://instagram.com/zaitoon.mobiles" target="_blank" rel="noopener" data-t="follow"></a></div>
</div></section>
</main>

<footer><div class="w">
  <div class="fl"><img src="/logo.png" alt=""><span><b>ZAITOON</b><small data-t="fsub"></small></span></div>
  <div>© <span id="yr"></span> <span data-t="brand"></span> · <span data-t="city"></span></div>
</div></footer>

<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 32 32"><path d="M4 5h24v16H14l-7 6v-6H4z"/></svg></a>

<script>
const WA='971555400551';
const T={
en:{brand:'Al Zaitoon Computer & Mobile Phones',city:'Ras Al Khaimah',fsub:'COMPUTER & MOBILE PHONES',navShop:'Collection',navWhy:'Our Promise',navVisit:'Visit',msg:'Message us',browse:'Browse collection',eyebrow:'MOBILES · LAPTOPS · IPADS · RAS AL KHAIMAH',sub:'Technology should feel effortless. We help you find the right phone, laptop or iPad, keep it running right, and bring it to your door.',search:'Search products or brands…',all:'All',items:n=>n+(n===1?' product':' products'),none:'No products match your search.',ask:'Ask for price',order:'Order on WhatsApp',whyH:'Our <em>promise</em>',w1h:'Authentic products only',w1p:'Every device and accessory is genuine and checked.',w2h:'Best price',w2p:'Message us on WhatsApp for today’s best price.',w3h:'Delivery across RAK',w3p:'We bring your order to your door.',w4h:'Repair service',w4p:'Repairs for your phone, laptop and iPad.',srv:['Computer & Laptop Sales','Repair & Maintenance','Mobile Sales & Repair','Screen & Battery Replacement','Accessories'],visitH:'Visit <em>us</em>',addrH:'Address',addr:'Al Dhait South, Ras Al Khaimah, UAE',whatsH:'WhatsApp',mailH:'Email',ctaH:'Your next device is <em>waiting.</em>',follow:'Follow on Instagram',hello:'Hello Al Zaitoon, I’d like to order: ',hi:'Hello Al Zaitoon, I’d like to ask about your products.'},
ar:{brand:'الزيتون للكمبيوتر والهواتف المحمولة',city:'رأس الخيمة',fsub:'أجهزة الكمبيوتر والهواتف المحمولة',navShop:'المنتجات',navWhy:'وعدنا',navVisit:'زورونا',msg:'راسلنا',browse:'تصفح المنتجات',eyebrow:'جوالات · لابتوبات · آيباد · رأس الخيمة',sub:'التقنية يجب أن تكون سهلة. نساعدك في اختيار الهاتف أو اللابتوب أو الآيباد المناسب، ونحافظ على عمله، ونوصله إلى باب بيتك.',search:'ابحث عن منتج أو ماركة…',all:'الكل',items:n=>n+' منتج',none:'لا توجد منتجات مطابقة لبحثك.',ask:'اسأل عن السعر',order:'اطلب عبر واتساب',whyH:'<em>وعدنا</em> لك',w1h:'منتجات أصلية فقط',w1p:'كل جهاز وملحق أصلي ومفحوص.',w2h:'أفضل سعر',w2p:'راسلنا على واتساب لأفضل سعر اليوم.',w3h:'توصيل في رأس الخيمة',w3p:'نوصل طلبك إلى باب بيتك.',w4h:'خدمة الصيانة',w4p:'صيانة الهاتف واللابتوب والآيباد.',srv:['بيع أجهزة الكمبيوتر المحمولة والمكتبية','الصيانة والإصلاح','بيع الهواتف المحمولة وإصلاحها','استبدال الشاشة والبطارية','ملحقات'],visitH:'<em>زورونا</em>',addrH:'العنوان',addr:'الظيت الجنوبي، رأس الخيمة، الإمارات',whatsH:'واتساب',mailH:'البريد الإلكتروني',ctaH:'جهازك القادم <em>ينتظرك.</em>',follow:'تابعنا على إنستغرام',hello:'مرحباً الزيتون، أرغب بطلب: ',hi:'مرحباً الزيتون، أود الاستفسار عن منتجاتكم.'}
};
const H={en:'Every device, <em>checked.</em>',ar:'كل جهاز، <em>مفحوص.</em>'};
const $=id=>document.getElementById(id);
let D={categories:[],products:[]},L=new URLSearchParams(location.search).get('lang')==='ar'?'ar':'en',C=-1,Q='';
const wa=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(){
  $('chips').innerHTML=['<button class="chip'+(C<0?' on':'')+'" data-c="-1">'+T[L].all+'</button>']
    .concat(D.categories.map((c,i)=>'<button class="chip'+(C===i?' on':'')+'" data-c="'+i+'">'+esc(c[L])+'</button>')).join('');
}
function grid(){
  const q=Q.trim().toLowerCase();
  const r=D.products.filter(p=>(C<0||p.cat===C)&&(!q||(p.brand+' '+p.name).toLowerCase().includes(q)));
  $('cnt').textContent=T[L].items(r.length);
  $('grid').innerHTML=r.length?r.map(p=>{
    const n=(p.brand?p.brand+' ':'')+p.name;
    return '<article class="c"><div class="im"><b>'+esc((p.brand||p.name).charAt(0))+'</b><img src="'+p.img+'" alt="'+esc(n)+'" loading="lazy" width="400" height="400" onerror="this.remove()"></div>'+
    '<div class="in"><div class="br">'+esc(p.brand)+'</div><div class="nm">'+esc(p.name)+'</div>'+
    '<div class="pr">'+(p.price?'AED '+p.price:T[L].ask)+'</div>'+
    '<a class="ord" target="_blank" rel="noopener" href="'+wa(T[L].hello+n)+'">'+T[L].order+'</a></div></article>';
  }).join(''):'<div class="empty">'+T[L].none+'</div>';
}
function lang(){
  const t=T[L];
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll('[data-h2]').forEach(e=>e.innerHTML=t[e.dataset.h2]);
  document.querySelector('[data-h]').innerHTML=H[L];
  $('srv').innerHTML=t.srv.map(s=>'<span>'+s+'</span>').join('');
  $('q').placeholder=t.search;$('lang').textContent=L==='ar'?'English':'عربي';
  ['msg','heroWa','ctaWa','fab'].forEach(i=>$(i).href=wa(t.hi));
  chips();grid();
}
$('lang').onclick=()=>{L=L==='ar'?'en':'ar';lang()};
$('q').oninput=e=>{Q=e.target.value;grid()};
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;C=+b.dataset.c;chips();grid()};
$('yr').textContent=new Date().getFullYear();
fetch('catalog.json').then(r=>r.json()).then(d=>{D=d;lang()}).catch(()=>{$('grid').innerHTML='<div class="empty">Could not load products. Please refresh.</div>'});
lang();
</script>
</body>
</html>
